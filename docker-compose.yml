version: '3.8'

services:
  flag-detection-service:
    build:
      context: .
      dockerfile: dockerfile
      args:
        USERNAME: ${USERNAME}
        EMAIL: ${EMAIL}
    container_name: flag-detection-container
    environment:
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "8080:80"
      - "8443:443"
    env_file:
      - .env